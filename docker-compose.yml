# PostgreSQL runs directly on the Ubuntu host (not in Docker).
# HTTPS/public access is handled by the existing Cloudflare tunnel (cloudflared on the host),
# which should point to http://localhost:3000.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_ROBLOX_GROUP_URL: ${NEXT_PUBLIC_ROBLOX_GROUP_URL}
        NEXT_PUBLIC_DISCORD_INVITE_URL: ${NEXT_PUBLIC_DISCORD_INVITE_URL}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Bound to loopback only: reachable by cloudflared, not from the internet
      - "127.0.0.1:3000:3000"

  # One-off tool: docker compose --profile tools run --rm migrate
  # Creates/updates tables and seeds the first CEO.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: builder
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts"
