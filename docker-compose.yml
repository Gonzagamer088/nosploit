# PostgreSQL runs directly on the Ubuntu host (not in Docker).
# Containers reach it through host.docker.internal -> host gateway.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_ROBLOX_GROUP_URL: ${NEXT_PUBLIC_ROBLOX_GROUP_URL}
        NEXT_PUBLIC_DISCORD_INVITE_URL: ${NEXT_PUBLIC_DISCORD_INVITE_URL}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # One-off tool: docker compose --profile tools run --rm migrate
  # Creates/updates tables and seeds the first CEO.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: builder
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts"

volumes:
  caddy_data:
  caddy_config:
